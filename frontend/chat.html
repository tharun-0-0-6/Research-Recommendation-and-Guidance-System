<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Expert - ResearchIQ</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f7f4;
            --surface: #ffffff;
            --text: #1a1916;
            --accent: #1e40af;
            --border: rgba(0,0,0,0.08);
            font-family: 'DM Sans', sans-serif;
        }
        body { background: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 600px; height: 550px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .chat-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .chat-name { font-weight: 600; flex: 1; }
        .back-btn { cursor: pointer; color: #6b7280; font-size: 14px; text-decoration: none; }
        
        .chat-body { flex: 1; padding: 1.5rem; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; background: #fafafa; }
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; }
        .msg.received { background: #e5e7eb; align-self: flex-start; }
        .msg.sent { background: var(--accent); color: white; align-self: flex-end; }
        
        .chat-footer { padding: 1rem; border-top: 1px solid var(--border); display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <a href="app.html" class="back-btn">← Back</a>
            <div class="avatar" id="teacher-initials">T</div>
            <div class="chat-name" id="teacher-name">Loading...</div>
        </div>
        <div class="chat-body" id="chatHistory">
            <!-- Messages load here -->
        </div>
        <div class="chat-footer">
            <input type="text" id="msgInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">Send</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const guideId = urlParams.get('guide') || 'T012';
        const guideName = urlParams.get('teacher') || 'Guide';
        
        const user = JSON.parse(sessionStorage.getItem('customer'));
        const guide = urlParams.get('guide');
        const teacherName = urlParams.get('teacher');
        
        if (!user || !guide) {
            window.location.href = 'login.html';
        }
        
        const studentId = user.cust_id;

        document.getElementById('teacher-name').textContent = guideName;
        document.getElementById('teacher-initials').textContent = guideName[0];

        async function loadHistory() {
            const res = await fetch(`/api/chat/history?user_a=${studentId}&user_b=${guideId}`);
            const data = await res.json();
            const container = document.getElementById('chatHistory');
            container.innerHTML = data.map(m => `
                <div class="msg ${m.sender === studentId ? 'sent' : 'received'}">${m.text}</div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function send() {
            const text = document.getElementById('msgInput').value;
            if (!text) return;
            await fetch('/api/chat/send', {
                method: 'POST',
                body: JSON.stringify({ sender: studentId, receiver: guideId, text: text })
            });
            document.getElementById('msgInput').value = '';
            loadHistory();
        }

        // Auto refresh
        loadHistory();
        setInterval(loadHistory, 3000);
    </script>
</body>
</html>
